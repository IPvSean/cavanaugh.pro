- title: "AnsibleFest 2019"
  description: "Coordinated the Ansible Workshops program at AnsibleFest Atlanta, covering Network Automation, Security Automation, RHEL Automation, and F5 Automation. Delivered a breakout on Introduction to Automation Analytics, and continued building the workshop infrastructure that became today's interactive labs platform."
  image: "/assets/images/ansiblefest-2019-booth-1.png"
  audience: "AnsibleFest Atlanta"
  year: 2019
  date: "September 24-25, 2019"
  photos: "https://photos.app.goo.gl/hnNKTZDJ9ZEWEW516"
  role_at_time: "Red Hat"
  talk_name: "Introduction to Automation Analytics"
  abstract: "Automation Analytics, a new cloud service from Red Hat, provides valuable insights and data about what, when and where Ansible Automation is being used. In addition, this data can also provide who is performing what automation and provide breakouts for comparing that data across an enterprise. We will walk through how to enable this feature on Ansible Tower and show the use cases we provide today. We will discuss viewing automation across all Ansible Tower clusters for an enterprise, notifications of cluster health and finally breakdowns of Automation use by organizations. We'll also discuss where we want to take Automation Analytics in the future, in conjunction with customers like you!"
  highlights:
    - "Coordinated Ansible Workshops across Network Automation, Security Automation, RHEL Automation, and F5 Automation"
    - "Started the first generation of what is now the Red Hat interactive labs platform at labs.demoredhat.com"
    - "Built the original AWS lab provisioner on github.com/ansible/workshops, enabling workshops before demo.redhat.com existed as a cross-BU platform"
  links:
    - label: "Interactive Labs"
      url: "https://labs.demoredhat.com/"
    - label: "Ansible Workshops"
      url: "https://github.com/ansible/workshops"
  gallery:
    - src: "/assets/images/ansiblefest-2019-booth-1.png"
      alt: "Demoing at the Ansible Automation Platform booth, AnsibleFest 2019, Atlanta, GA"
    - src: "/assets/images/ansiblefest-2019-booth-2.png"
      alt: "Crowd gathering at the Ansible booth, AnsibleFest 2019, Atlanta, GA"
    - src: "/assets/images/ansiblefest-2019-booth-3.png"
      alt: "Demoing Ansible Automation Platform to attendees, AnsibleFest 2019, Atlanta, GA"

