<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-brand">
      <span class="footer-logo">Sean Cavanaugh</span>
      <p class="footer-tagline">AI &bull; Automation &bull; Cloud</p>
    </div>
    <div class="footer-links">
      <div class="footer-col">
        <h4>Navigate</h4>
        {% for item in site.data.navigation %}
        <a href="{{ item.url }}">{{ item.title }}</a>
        {% endfor %}
      </div>
      <div class="footer-col">
        <h4>Connect</h4>
        <a href="{{ site.social.youtube }}" target="_blank" rel="noopener">YouTube</a>
        <a href="{{ site.social.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
        <a href="{{ site.social.github }}" target="_blank" rel="noopener">GitHub</a>
        <a href="{{ site.social.tiktok }}" target="_blank" rel="noopener">TikTok</a>
        <a href="{{ site.social.instagram }}" target="_blank" rel="noopener">Instagram</a>
        <a href="{{ site.social.facebook }}" target="_blank" rel="noopener">Facebook</a>
        <a href="{{ site.social.bluesky }}" target="_blank" rel="noopener">Bluesky</a>
        <a href="{{ site.social.x }}" target="_blank" rel="noopener">X</a>
      </div>
      <div class="footer-col">
        <h4>More</h4>
        <a href="/resources/">Resources</a>
        <a href="/contact/">Contact</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS Feed</a>
      </div>
    </div>
  </div>
  <div class="footer-bottom">
    <p>&copy; {{ site.time | date: '%Y' }} Sean Cavanaugh. All rights reserved.</p>
  </div>
</footer>
