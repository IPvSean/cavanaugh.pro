title: Sean Cavanaugh
description: "AI • Automation • Cloud. Building enterprise AI demos that developers actually use."
url: "https://cavanaugh.pro"
baseurl: ""

permalink: /blog/:title/

collections:
  projects:
    output: true
    permalink: /projects/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "project"
  - scope:
      path: "pages"
      type: "pages"
    values:
      layout: "page"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md

social:
  youtube: "https://www.youtube.com/ansibleautomation"
  linkedin: "https://www.linkedin.com/in/seanecavanaugh"
  github: "https://github.com/IPvSean"
  tiktok: "https://www.tiktok.com/@ipvsean"
  instagram: "https://www.instagram.com/ipvsean"
  facebook: "https://www.facebook.com/ipvsean"
  x: "https://x.com/ipvsean"
  bluesky: "https://bsky.app/profile/ipvsean.bsky.social"
  linktree: "https://linktr.ee/ipvsean"
